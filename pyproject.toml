[project]
name = "lattice"
version = "0.1.0"
description = "Graph-native autonomous research agent with governed, evolving memory."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langchain>=1.0.0",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=0.2.0",
    "langgraph>=1.0.0",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.9",
    "pyyaml>=6.0.1",
    "typing-extensions>=4.12",
]

[project.scripts]
lattice = "lattice.app.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["lattice"]
